listenAddress: ":9400"
scrapeInterval: 30s
scrapeTimeout: 10s
maxConcurrency: 8

# Local development only. In a cluster, omit this field to use the Pod's
# ServiceAccount.
kubeconfig: /Users/kezheng/.kubectl/develop.config
sources:
  # Static addresses can be listed multiple times.
  - name: gpu-node-a
    acceleratorType: gpu
    address: http://10.0.0.11:9400/metrics

  - name: gpu-node-b
    acceleratorType: gpu
    address: http://10.0.0.12:9400/metrics

  # PodMonitor-style discovery: scrape every matching running Pod by Pod IP.
  - name: vgpu-pods
    acceleratorType: vgpu
    podMonitor:
      namespaceSelector:
        matchNames:
          - volcano-system
      selector:
        matchLabels:
          app.kubernetes.io/name: volcano-device-plugin
        matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
              - volcano-vgpu-device-plugin
      port: metrics
      path: /metrics
      scheme: http

  # ServiceMonitor-style discovery: expand matching Services through
  # EndpointSlices and scrape every ready backend address directly.
  - name: npu-services
    acceleratorType: npu
    serviceMonitor:
      namespaceSelector:
        matchNames:
          - npu-exporter
      selector:
        matchLabels:
          app.kubernetes.io/component: npu-exporter
      port: http
      path: /metrics
      scheme: http

  # The same endpoint can use another adapter when it exposes both NPU and
  # vNPU metric families.
  - name: vnpu-node-a
    acceleratorType: vnpu
    address: http://10.0.1.11:8082/metrics
    labels:
      node: npu-node-a
