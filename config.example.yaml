listenAddress: ":9400"
scrapeInterval: 30s
scrapeTimeout: 10s
maxConcurrency: 8

# Local development only. In a cluster, omit this field to use the Pod's
# ServiceAccount. Pass --node-name or set NODE_NAME when running locally.
kubeconfig: /Users/kezheng/.kubectl/develop.config
sources:
  # ServiceMonitor-style discovery expands the matching Service through
  # EndpointSlices, then keeps only ready endpoints on the local node.
  - name: dcgm-services
    acceleratorType: gpu
    serviceMonitor:
      namespaceSelector:
        matchNames:
          - rune-system
      selector:
        matchLabels:
          app: nvidia-dcgm-exporter
      port: gpu-metrics
      path: /metrics
      scheme: http

  # PodMonitor-style discovery lists only matching running Pods scheduled on
  # the local node and scrapes them by Pod IP.
  - name: vgpu-pods
    acceleratorType: vgpu
    podMonitor:
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          app.kubernetes.io/name: volcano-device-plugin
          app.kubernetes.io/component: volcano-vgpu-device-plugin
      port: metrics
      path: /metrics
      scheme: http

  - name: npu-services
    acceleratorType: npu
    serviceMonitor:
      namespaceSelector:
        matchNames:
          - npu-exporter
      selector:
        matchLabels:
          app: npu-exporter
      port: http-metrics
      path: /metrics
      scheme: http

  # The same local endpoint can use another adapter when it exposes both NPU
  # and vNPU metric families.
  - name: vnpu-services
    acceleratorType: vnpu
    serviceMonitor:
      namespaceSelector:
        matchNames:
          - npu-exporter
      selector:
        matchLabels:
          app: npu-exporter
      port: http-metrics
      path: /metrics
      scheme: http
