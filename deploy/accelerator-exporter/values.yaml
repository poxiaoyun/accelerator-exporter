revisionHistoryLimit: 3

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

image:
  repository: registry.cn-hangzhou.aliyuncs.com/xiaoshiai/accelerator-exporter
  # Defaults to Chart.appVersion so a versioned package deploys its matching image.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  scrapeInterval: 30s
  scrapeTimeout: 10s
  maxConcurrency: 8
  sources:
    - nvidia-dcgm
    - volcano-vgpu
    - ascend-npu

  # Internal preset definitions selected by config.sources. Each preset names the
  # built-in rule that interprets its metrics: the rule decides device_type,
  # device_mode, vendor and the identity of every observation target, so a preset
  # never states them itself. These are kept out of values.schema.json so users
  # only choose the collectors they need.
  sourceDefinitions:
    nvidia-dcgm:
      name: nvidia-dcgm-exporter
      rule: nvidia-dcgm
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - rune-system
            - gpu-operator
        selector:
          matchLabels:
            app: nvidia-dcgm-exporter
        port: gpu-metrics
        path: /metrics
        scheme: http

    volcano-vgpu:
      name: volcano-vgpu-device-plugin
      rule: volcano-vgpu
      podMonitor:
        namespaceSelector:
          matchNames:
            - kube-system
        selector:
          matchLabels:
            app.kubernetes.io/name: volcano-device-plugin
            app.kubernetes.io/component: volcano-vgpu-device-plugin
        port: metrics
        path: /metrics
        scheme: http

    # One preset covers the whole npu-exporter endpoint. It exposes both the
    # physical NPU families and the vNPU families, so a separate vNPU preset
    # would scrape the same endpoint twice and discard half the result.
    ascend-npu:
      name: npu-exporter
      rule: ascend-npu
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - npu-exporter
        selector:
          matchLabels:
            app: npu-exporter
        port: http-metrics
        path: /metrics
        scheme: http

  # Optional PodMonitor/ServiceMonitor source definitions for non-standard installations.
  # This field is intentionally not exposed in the user-facing schema.
  customSources: []

# accelerator_pod_info is built from kubelet's device allocation facts, read from
# the pod-resources socket. The directory is mounted read-only at the same path
# inside the container, so the default --pod-resources-socket keeps working.
# Set hostPath to "" on a cluster that does not expose it: the exporter then
# still produces the whole device layer, and reports
# accelerator_exporter_allocation_source_configured 0.
podResources:
  hostPath: /var/lib/kubelet/pod-resources

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

containerPort: 9400

service:
  type: ClusterIP
  port: 9400
  annotations: {}

metrics:
  serviceMonitor:
    # Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
extraArgs: []
