revisionHistoryLimit: 3

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

image:
  # The registry part is replaced by global.imageRegistry when a platform sets it,
  # so that installing from a mirror serves the same repository path.
  repository: registry.cn-hangzhou.aliyuncs.com/xiaoshiai/accelerator-exporter
  # Defaults to Chart.appVersion so a versioned package deploys its matching image.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  scrapeInterval: 30s
  scrapeTimeout: 10s
  maxConcurrency: 8

  # Metrics scraping and disk discovery run together by default. Set this to
  # false only for a disk-only deployment.
  metrics:
    enabled: true

  # exporter reads the host filesystem read-only and publishes mounted,
  # non-system block-device filesystems to the Node annotation.
  diskDiscovery:
    enabled: true
    hostRoot: /host-root
    interval: 30s

  # Every supported source is enabled below, which is also what a deployment
  # needs: nothing has to be chosen, and a source whose component is not
  # installed resolves no endpoint and is simply not used. This list is therefore
  # hidden from the configuration page; it is only here so that a cluster which
  # installs a component somewhere unusual can override its discovery. When
  # metrics are enabled and this list is empty, the chart restores these built-in
  # defaults so an old release cannot silently lose accelerator metrics.
  #
  # The order matters when two entries cover the same metric on the same
  # observation target: the one listed first wins and the other reading is counted
  # in accelerator_exporter_duplicate_samples_total. DCGM reads a whole card from
  # the driver, so it is listed before the vGPU monitor, which reads the same card
  # from its own sampler.
  #
  # Each entry needs a unique name plus the built-in rule that interprets its
  # metrics. The rule decides device_type, device_mode, vendor and the identity of
  # every observation target, so an entry never states them itself. Exactly one of
  # podMonitor and serviceMonitor says how its endpoints are found.
  sources:
    - name: nvidia-dcgm-exporter
      rule: nvidia-dcgm
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - rune-system
            - gpu-operator
        selector:
          matchLabels:
            app: nvidia-dcgm-exporter
        port: gpu-metrics
        path: /metrics
        scheme: http

    - name: volcano-vgpu-device-plugin
      rule: volcano-vgpu
      podMonitor:
        namespaceSelector:
          matchNames:
            - kube-system
        selector:
          matchLabels:
            app.kubernetes.io/name: volcano-device-plugin
            app.kubernetes.io/component: volcano-vgpu-device-plugin
        port: metrics
        path: /metrics
        scheme: http

    # One entry covers the whole npu-exporter endpoint. It exposes both the
    # physical NPU families and the vNPU families, so a separate vNPU entry
    # would scrape the same endpoint twice and discard half the result.
    # npu-exporter ships as a DaemonSet and MindCluster does not create a
    # Service for it, so it is discovered by Pod labels on the local node.
    # MindCluster also guards the pods with a NetworkPolicy that admits only
    # Prometheus-labelled traffic; on such a cluster set podLabels to
    # app: prometheus so the exporter passes that policy.
    - name: npu-exporter
      rule: ascend-npu
      podMonitor:
        namespaceSelector:
          matchNames:
            - npu-exporter
        selector:
          matchLabels:
            app: npu-exporter
        port: http
        path: /metrics
        scheme: http

    # The DCU Support release may be installed in any namespace. These labels
    # select only its exporter Service; the discovery layer keeps local endpoints.
    - name: dcu-exporter
      rule: hygon-dcu
      serviceMonitor:
        namespaceSelector:
          any: true
        selector:
          matchLabels:
            app.kubernetes.io/name: dcu-support
            app.kubernetes.io/component: exporter
        port: metrics
        path: /metrics
        scheme: http

# accelerator_pod_info is built from kubelet's device allocation facts, read from
# the pod-resources socket. The directory is mounted read-only at the same path
# inside the container, so the default --pod-resources-socket keeps working.
# Set hostPath to "" on a cluster that does not expose it: the exporter then
# still produces the device layer of every source whose identity comes from the
# samples, and reports accelerator_exporter_allocation_source_configured 0.
# The volcano-vgpu source is the exception: a slice is named only by the
# allocation fact, so without it that source produces no device_id and its
# series are reported as an identity gap instead.
podResources:
  hostPath: /var/lib/kubelet/pod-resources

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

# In the cluster the exporter reads kubelet's pod-resources socket as root: the
# socket is root:root 0755, and connecting to a unix socket needs write
# permission on it, so a container running as another user cannot read the
# device allocation facts at all. The relation layer would then stay empty while
# the exporter reported itself ready. Everything else stays hardened: no
# privilege escalation, all capabilities dropped, a read-only root filesystem
# and RuntimeDefault seccomp.
podSecurityContext:
  runAsNonRoot: false
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0

containerPort: 9400

service:
  type: ClusterIP
  port: 9400
  annotations: {}

metrics:
  serviceMonitor:
    # Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
extraArgs: []
