revisionHistoryLimit: 3

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

image:
  repository: registry.cn-hangzhou.aliyuncs.com/xiaoshiai/accelerator-exporter
  tag: main
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

config:
  scrapeInterval: 30s
  scrapeTimeout: 10s
  maxConcurrency: 8
  sources:
    - nvidia-dcgm
    - volcano-vgpu
    - ascend-npu
    - ascend-vnpu

  # Internal preset definitions selected by config.sources. These are kept out
  # of values.schema.json so users only choose the collectors they need.
  sourceDefinitions:
    nvidia-dcgm:
      name: dcgm-service
      acceleratorType: gpu
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - gpu-operator
        selector:
          matchLabels:
            app: nvidia-dcgm-exporter
        port: gpu-metrics
        path: /metrics
        scheme: http

    volcano-vgpu:
      name: vgpu-pods
      acceleratorType: vgpu
      podMonitor:
        namespaceSelector:
          matchNames:
            - volcano-system
        selector:
          matchLabels:
            name: volcano-device-plugin
        port: 9394
        path: /metrics
        scheme: http

    ascend-npu:
      name: npu-services
      acceleratorType: npu
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - npu-exporter
        selector:
          matchLabels:
            app: npu-exporter
        port: http-metrics
        path: /metrics
        scheme: http

    ascend-vnpu:
      name: vnpu-services
      acceleratorType: vnpu
      serviceMonitor:
        namespaceSelector:
          matchNames:
            - npu-exporter
        selector:
          matchLabels:
            app: npu-exporter
        port: http-metrics
        path: /metrics
        scheme: http

  # Optional PodMonitor/ServiceMonitor source definitions for non-standard installations.
  # This field is intentionally not exposed in the user-facing schema.
  customSources: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

rbac:
  create: true

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

containerPort: 9400

service:
  type: ClusterIP
  port: 9400
  annotations: {}

metrics:
  serviceMonitor:
    # Requires the monitoring.coreos.com/v1 ServiceMonitor CRD.
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 30
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 2
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
extraArgs: []
