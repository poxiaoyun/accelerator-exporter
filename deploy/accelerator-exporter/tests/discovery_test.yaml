suite: source configuration
templates:
  - templates/configmap.yaml
tests:
  - it: discovers DCGM in both legacy and NVIDIA Support namespaces
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: nvidia-dcgm-exporter\s+rule: nvidia-dcgm\s+serviceMonitor:\s+namespaceSelector:\s+matchNames:\s+- rune-system\s+- gpu-operator\s+path: /metrics\s+port: gpu-metrics\s+scheme: http\s+selector:\s+matchLabels:\s+app: nvidia-dcgm-exporter'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: volcano-vgpu-device-plugin\s+podMonitor:\s+namespaceSelector:\s+matchNames:\s+- kube-system'
  - it: keeps the order the sources are configured in
    set:
      config.sources:
        - name: npu-exporter
          rule: ascend-npu
          serviceMonitor:
            namespaceSelector:
              matchNames: [npu-exporter]
            selector:
              matchLabels:
                app: npu-exporter
            port: http-metrics
        - name: nvidia-dcgm-exporter
          rule: nvidia-dcgm
          serviceMonitor:
            namespaceSelector:
              matchNames: [rune-system]
            selector:
              matchLabels:
                app: nvidia-dcgm-exporter
            port: gpu-metrics
    asserts:
      # The order is the precedence between sources, so the rendered config has
      # to keep it instead of sorting the entry names.
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?s)sources:\n\s+- name: npu-exporter.*- name: nvidia-dcgm-exporter'
  - it: renders only the sources that are configured
    set:
      config.sources:
        - name: nvidia-dcgm-exporter
          rule: nvidia-dcgm
          serviceMonitor:
            namespaceSelector:
              matchNames: [custom-gpu]
            selector:
              matchLabels:
                app: nvidia-dcgm-exporter
            port: gpu-metrics
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: nvidia-dcgm-exporter\s+rule: nvidia-dcgm\s+serviceMonitor:\s+namespaceSelector:\s+matchNames:\s+- custom-gpu'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'rune-system|gpu-operator|volcano-vgpu-device-plugin|npu-exporter'
  - it: restores built-in sources when metrics are enabled and sources are empty
    set:
      config.sources: []
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: nvidia-dcgm-exporter\s+rule: nvidia-dcgm'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: volcano-vgpu-device-plugin\s+rule: volcano-vgpu'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'name: npu-exporter\s+rule: ascend-npu'
