apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accelerator-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "accelerator-exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    listenAddress: {{ printf ":%v" .Values.containerPort | quote }}
    scrapeInterval: {{ .Values.config.scrapeInterval | quote }}
    scrapeTimeout: {{ .Values.config.scrapeTimeout | quote }}
    maxConcurrency: {{ .Values.config.maxConcurrency }}
    sources:
      {{- toYaml .Values.config.sources | nindent 6 }}
