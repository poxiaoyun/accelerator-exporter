apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "accelerator-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "accelerator-exporter.labels" . | nindent 4 }}
data:
  config.yaml: |
    listenAddress: {{ printf ":%v" .Values.containerPort | quote }}
    scrapeInterval: {{ .Values.config.scrapeInterval | quote }}
    scrapeTimeout: {{ .Values.config.scrapeTimeout | quote }}
    maxConcurrency: {{ .Values.config.maxConcurrency }}
    diskDiscovery:
      enabled: {{ .Values.config.diskDiscovery.enabled }}
      hostRoot: {{ .Values.config.diskDiscovery.hostRoot | quote }}
      interval: {{ .Values.config.diskDiscovery.interval | quote }}
    {{- $sources := .Values.config.sources }}
    {{- if and .Values.config.metrics.enabled (not $sources) }}
    {{- $sources = include "accelerator-exporter.defaultSources" . | fromYamlArray }}
    {{- end }}
    sources:
      {{- toYaml (ternary $sources (list) .Values.config.metrics.enabled) | nindent 6 }}
