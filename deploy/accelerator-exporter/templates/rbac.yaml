{{- $discoveryEnabled := eq (include "accelerator-exporter.kubernetesDiscoveryEnabled" .) "true" }}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "accelerator-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "accelerator-exporter.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if and $discoveryEnabled .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "accelerator-exporter.clusterRoleName" . }}
  labels:
    {{- include "accelerator-exporter.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
    verbs:
      - get
      - list
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "accelerator-exporter.clusterRoleName" . }}
  labels:
    {{- include "accelerator-exporter.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "accelerator-exporter.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "accelerator-exporter.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
